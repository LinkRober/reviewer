[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leke-code-reviewer"
version = "0.1.0"
description = "Leke iOS code review CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.53,<3",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
]

[project.scripts]
lcr = "lcr.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lcr.prompt" = ["*.md"]
